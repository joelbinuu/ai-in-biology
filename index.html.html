<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethical and Social Issues of AI in Biology</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0C11;--ink:#ECEEF5;--muted:#A3AABD;--line:#272C3D;--c:#8B9CFF;color-scheme:dark;box-sizing:border-box;
 --d:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--b:'Instrument Sans','Helvetica Neue',Arial,sans-serif}
html{background:var(--bg);scroll-padding-top:4rem}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 1.0625rem/1.6 var(--b);background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(60rem 40rem at 88% -8%,rgba(139,156,255,.2),transparent),radial-gradient(46rem 38rem at -8% 55%,rgba(255,138,122,.1),transparent),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/30px 30px}
#top{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:1rem;
 padding:calc(.7rem + env(safe-area-inset-top,0px)) 1.25rem .7rem;background:rgba(10,12,17,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);font-size:.92rem}
#top b{font:700 .98rem var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .r{display:flex;align-items:center;gap:1rem;white-space:nowrap}
#av{display:flex}
#av span{width:1.7rem;height:1.7rem;border-radius:50%;margin-left:-.4rem;display:grid;place-items:center;font:700 .62rem var(--d);color:#0A0C11;border:2px solid var(--bg);transition:transform .25s,box-shadow .25s}
#av span.on{transform:translateY(-3px);box-shadow:0 0 0 2px currentColor}
#cnt{color:var(--muted)}
#bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--c)}
.wrap{max-width:66rem;margin:0 auto;padding:0 1.5rem}
section{padding:clamp(5.5rem,16vh,9rem) 0 clamp(2rem,6vh,4rem)}
section.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center}
.lab{color:var(--muted);font-size:.95rem;margin:0 0 1rem}
h1,h2{font-family:var(--d);margin:0;letter-spacing:-.035em}
h1{font-weight:800;font-size:clamp(2.7rem,9vw,6.6rem);line-height:.96}
h2{font-weight:700;font-size:clamp(2rem,5.2vw,3.7rem);line-height:1.04}
.ty .on::after{content:"";display:inline-block;width:.07em;min-width:2px;height:.95em;margin-left:.05em;vertical-align:-.1em;background:var(--c);opacity:0}
.ty.act .on::after{opacity:1;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.off{color:transparent}
.sub{font-size:clamp(1.1rem,2.3vw,1.4rem);max-width:38rem;color:var(--muted);margin:1.75rem 0 0}
.by{margin:1.75rem 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2.75rem 2rem;margin-top:3.5rem}
.in{border-top:2px solid var(--c);padding-top:1rem;opacity:var(--q);
 transform:translate(calc((1 - var(--q)) * var(--dx)),calc((1 - var(--q)) * 50px)) rotate(calc((1 - var(--q)) * var(--rot)));
 outline:1.5px dashed color-mix(in srgb,var(--c) calc((1 - var(--q)) * 100%),transparent);outline-offset:8px}
.in h3{font:700 1.4rem/1.2 var(--d);letter-spacing:-.02em;margin:0 0 .5rem}
.in p{margin:0;color:var(--muted)}
.n{font:800 2.2rem/1 var(--d);color:var(--c);display:block;margin-bottom:.75rem}
.hdr{display:grid;grid-template-columns:1.25fr 1fr;gap:3rem;align-items:center}
.img .in{border:0;padding:0;border-radius:1rem;overflow:hidden}
.img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tbl{margin-top:3rem}
.tbl .hd,.row .in{display:grid;grid-template-columns:1fr 1.5fr;gap:1rem;padding:1rem .75rem}
.tbl .hd{color:var(--muted);font-size:.95rem;border-bottom:1px solid var(--line)}
.row .in{border-top:1px solid var(--line);outline-offset:-2px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent) calc(var(--q) * 100%),transparent 0)}
.row b{font-family:var(--d)}
.row span{color:var(--muted)}
blockquote{margin:3rem 0 0;font:700 clamp(1.5rem,4vw,2.6rem)/1.2 var(--d);letter-spacing:-.025em;max-width:46rem}
.sc{max-width:46rem;margin-top:4rem;border-left:2px solid var(--c);padding-left:1.25rem;white-space:pre-line;color:#CBD0E0;font-size:1.02rem}
.who{display:block;color:var(--c);font-weight:500;font-size:.92rem;margin-bottom:.6rem;white-space:normal}
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform}
.cur svg{width:20px;height:20px;display:block}
.cur b{position:absolute;left:14px;top:17px;font:500 .78rem/1 var(--b);padding:.28rem .55rem;border-radius:.4rem;color:#0A0C11;white-space:nowrap}
.cur i{position:absolute;left:-9px;top:-9px;width:22px;height:22px;border:2px solid;border-radius:50%;opacity:0}
@media (max-width:46rem){.hdr{grid-template-columns:1fr;gap:2rem}.tbl .hd,.row .in{grid-template-columns:1fr;gap:.25rem}.tbl .hd span:last-child{display:none}#top b{display:none}}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
section[data-sl="12"]{min-height:100vh;min-height:100svh;display:flex;align-items:center}
section .wrap{width:100%}
section[data-sl="12"] h2{font-size:clamp(2.6rem,8vw,6rem);line-height:1}
section[data-sl="12"] .sub{font-size:clamp(1.3rem,3vw,2rem);color:var(--ink)}
.settle{height:75vh}
#feedback-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 500px;
  margin: 4rem auto;
  padding: 2.5rem;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  border: 1px solid var(--line);
  text-align: center;
}

#feedback-form form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
  margin-top: 1.5rem;
}

#feedback-form div {
  text-align: left;
}

#feedback-form label {
  font-size: 0.9rem;
  color: var(--muted);
  display: block;
  margin-bottom: 0.3rem;
}

#feedback-form input,
#feedback-form select,
#feedback-form textarea {
  width: 100%;
  padding: 0.75rem;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #151824;
  color: var(--ink);
  font-family: inherit;
}

#feedback-form button {
  padding: 0.8rem 1.5rem;
  border: none;
  border-radius: 6px;
  background: var(--c);
  color: #0A0C11;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 0.5rem;
}

#feedback-form button:hover {
  opacity: 0.9;
}
</style>
